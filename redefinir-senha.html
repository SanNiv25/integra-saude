<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha | Integra Saúde</title>

    <!-- Estilos compatíveis com o padrão da Integra Saúde -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border-top: 6px solid #0F766E;
            text-align: center;
        }

        .logo-container img {
            height: 60px;
            margin-bottom: 15px;
        }

        h2 {
            color: #0F4C5C;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #555555;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px 40px 12px 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #0F766E;
        }

        .btn-toggle-senha {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            color: #777777;
            display: flex;
            align-items: center;
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background-color: #0F766E;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: #0d5f58;
        }

        .btn-primary:disabled {
            background-color: #999999;
            cursor: not-allowed;
        }

        .voltar-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 14px;
            color: #0F766E;
            text-decoration: none;
            font-weight: 600;
        }

        .voltar-link:hover {
            text-decoration: underline;
        }

        .erro-msg {
            color: #d9534f;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
    </style>

    <!-- Carrega a biblioteca oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Carrega a sua configuração do Supabase -->
    <script src="supabase.js"></script>
</head>

<body>

    <div class="auth-container">
        <div class="logo-container">
            <img src="img/logo.png" alt="Integra Saúde" onerror="this.style.display='none'">
        </div>

        <h2>Nova Senha</h2>
        <p>Digite e confirme a nova senha que você usará para acessar a plataforma.</p>

        <form id="formRedefinir">
            <div class="form-group">
                <label for="novaSenha">Nova Senha</label>
                <div class="input-wrapper">
                    <input type="password" id="novaSenha" placeholder="Mínimo 6 caracteres" required minlength="6">
                    <button type="button" class="btn-toggle-senha" onclick="toggleVisibilidade('novaSenha', this)">
                        👁️
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmaSenha">Confirmar Nova Senha</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmaSenha" placeholder="Repita a senha" required minlength="6">
                    <button type="button" class="btn-toggle-senha" onclick="toggleVisibilidade('confirmaSenha', this)">
                        👁️
                    </button>
                </div>
                <div id="erroSenha" class="erro-msg">As senhas não coincidem!</div>
            </div>

            <button type="submit" id="btnSalvar" class="btn-primary">Salvar Nova Senha</button>
        </form>

        <a href="index.html" class="voltar-link">← Voltar para a Página Inicial</a>
    </div>

    <script>
        // 1. Função simples para mostrar/ocultar a senha ao clicar no olhinho
        function toggleVisibilidade(idCampo, botao) {
            const campo = document.getElementById(idCampo);
            if (campo.type === "password") {
                campo.type = "text";
                botao.innerText = "🔒";
            } else {
                campo.type = "password";
                botao.innerText = "👁️";
            }
        }

        // 2. Intercepta o envio do formulário e salva a nova senha no Supabase
        document.getElementById("formRedefinir").addEventListener("submit", async function (e) {
            e.preventDefault();

            const novaSenha = document.getElementById("novaSenha").value;
            const confirmaSenha = document.getElementById("confirmaSenha").value;
            const erroDiv = document.getElementById("erroSenha");
            const btnSalvar = document.getElementById("btnSalvar");

            // Esconde erro antigo
            erroDiv.style.display = "none";

            // Valida se as duas senhas são iguais
            if (novaSenha !== confirmaSenha) {
                erroDiv.style.display = "block";
                return;
            }

            btnSalvar.innerText = "⏳ Salvando...";
            btnSalvar.disabled = true;

            try {
                // Usa o cliente inicializado no seu arquivo supabase.js
                const supabase = window.supabaseClient;

                // Atualiza a senha no Supabase Auth usando a sessão liberada pelo link do e-mail
                const { data, error } = await supabase.auth.updateUser({
                    password: novaSenha
                });

                if (error) {
                    alert("❌ Erro ao atualizar senha: " + error.message);
                    btnSalvar.innerText = "Salvar Nova Senha";
                    btnSalvar.disabled = false;
                } else {
                    alert("✅ Senha redefinida com sucesso! Você será redirecionado para a página de login.");
                    window.location.href = "index.html";
                }

            } catch (err) {
                console.error("Erro inesperado:", err);
                alert("❌ Ocorreu um erro ao processar a solicitação.");
                btnSalvar.innerText = "Salvar Nova Senha";
                btnSalvar.disabled = false;
            }
        });
    </script>
</body>

</html>
